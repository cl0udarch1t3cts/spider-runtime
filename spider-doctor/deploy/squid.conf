http_port 3128
pid_filename none
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
coredump_dir /tmp

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl allowed_protocol proto HTTP HTTPS
http_access deny !allowed_protocol
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Block local, private, carrier-grade NAT, link-local, documentation,
# benchmarking, multicast, and metadata destinations after DNS resolution.
acl blocked_v4 dst 0.0.0.0/8
acl blocked_v4 dst 10.0.0.0/8
acl blocked_v4 dst 100.64.0.0/10
acl blocked_v4 dst 127.0.0.0/8
acl blocked_v4 dst 169.254.0.0/16
acl blocked_v4 dst 172.16.0.0/12
acl blocked_v4 dst 192.0.0.0/24
acl blocked_v4 dst 192.0.2.0/24
acl blocked_v4 dst 192.168.0.0/16
acl blocked_v4 dst 198.18.0.0/15
acl blocked_v4 dst 198.51.100.0/24
acl blocked_v4 dst 203.0.113.0/24
acl blocked_v4 dst 224.0.0.0/4
acl blocked_v4 dst 240.0.0.0/4
acl blocked_v6 dst ::/128
acl blocked_v6 dst ::1/128
acl blocked_v6 dst fc00::/7
acl blocked_v6 dst fe80::/10
acl blocked_v6 dst ff00::/8
acl blocked_names dstdomain localhost .local .internal

http_access deny blocked_v4
http_access deny blocked_v6
http_access deny blocked_names
http_access allow all
