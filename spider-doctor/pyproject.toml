[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spider-doctor"
version = "0.1.0"
description = "Ephemeral Hermes workers that create and repair deterministic spider scripts"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pymongo>=4.13",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "mongomock>=4.3",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
spider-doctor-worker = "spider_doctor.main:main"
spider-doctor-enqueue = "spider_doctor.enqueue:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
