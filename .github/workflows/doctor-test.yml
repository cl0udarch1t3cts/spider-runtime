name: doctor-test

on:
  push:
    branches: [main]
    paths:
      - "spider-doctor/**"
      - ".github/workflows/doctor-test.yml"
  pull_request:
    paths:
      - "spider-doctor/**"
      - ".github/workflows/doctor-test.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: spider-doctor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run pytest
      - run: uv run ruff check .
