name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run pytest
      - name: Validate Compose and real MongoDB behavior
        run: |
          trap 'docker compose down -v' EXIT
          docker compose config --quiet
          docker compose up -d --wait mongo
          docker compose exec -T mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})'
          until docker compose exec -T mongo mongosh --quiet --eval \
            'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done
          CONTROL_NETWORK=$(docker network ls \
            --filter label=com.docker.compose.network=control --format '{{.ID}}')
          docker run --rm --network "$CONTROL_NETWORK" \
            -v "$PWD:/workspace" -w /workspace \
            -e UV_PROJECT_ENVIRONMENT=/tmp/test-venv \
            -e SPIDER_TEST_MONGODB_URI='mongodb://mongo:27017/spider_integration?replicaSet=rs0&directConnection=true' \
            ghcr.io/astral-sh/uv:python3.13-bookworm-slim \
            uv run --frozen --dev pytest tests/test_mongo_integration.py
      - run: docker build -t spider-executor:test .
